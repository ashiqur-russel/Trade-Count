<tc-sync-attention />

@if (store.notice(); as notice) {
  <tc-alert (dismissed)="store.notice.set(null)">{{ notice }}</tc-alert>
}

<tc-portfolio-summary />

<div class="bench">
  <tc-trade-form
    [editing]="editingTrade()"
    [preferredStockId]="filter().stockId"
    (finished)="editingTrade.set(null)"
  />
  <tc-stocks-panel
    [selectedStockId]="filter().stockId"
    (selectedStockIdChange)="selectStock($event)"
  />
</div>

<tc-ledger-panel
  [(filter)]="filter"
  [editingTradeId]="editingTrade()?.id ?? null"
  (editTrade)="startEdit($event)"
/>
