<tc-backdrop />
<header class="top">
  <div class="meta">
    <span>FIFO ledger</span>
    <span class="meta-middle">Stored only on this device</span>
    <span>{{ today }}</span>
  </div>
  <div class="bar">
    <a class="brand" routerLink="/">
      <tc-brand-mark class="brand-mark" />
      <span>Trade Count</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Portfolio</a
      >
      <a routerLink="/reports" routerLinkActive="active" ariaCurrentWhenActive="page">Reports</a>
      @if (insightsKeyStored()) {
        <a routerLink="/insights" routerLinkActive="active" ariaCurrentWhenActive="page"
          >Insights</a
        >
      }
      <tc-settings-link />
    </nav>
  </div>
</header>
@if (isHome()) {
  <tc-intro-banner />
}
<main>
  <tc-update-banner />
  <tc-install-hint />
  <router-outlet />
</main>
<tc-site-footer />
