<tc-backdrop />
<header class="masthead">
  <div class="meta">
    <span>FIFO ledger</span>
    <span>Profit &amp; loss · EUR</span>
    <span>{{ today }}</span>
  </div>
  <h1 class="wordmark"><tc-brand-mark class="mark" /><span>Trade Count</span></h1>
  <div class="meta tagline">
    <p>
      Every sale is matched against your oldest open buys first, the way your broker and the
      Finanzamt count it.
    </p>
    <tc-segmented-control
      label="Colour theme"
      [options]="themeOptions"
      [(value)]="theme.preference"
    />
  </div>
</header>
<main>
  <router-outlet />
</main>
