<div class="track" role="radiogroup" [attr.aria-label]="label()">
  @for (option of options(); track option.value) {
    <label class="option">
      <input
        type="radio"
        [name]="groupName"
        [value]="option.value"
        [checked]="option.value === value()"
        (change)="value.set(option.value)"
      />
      <span>{{ option.label }}</span>
    </label>
  }
</div>
